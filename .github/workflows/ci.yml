name: CI

# Scoped to main because that is where commits actually go — one per card,
# straight to the branch. Unscoped `push` plus `pull_request` also meant any
# future PR branch would be built twice, once for each trigger.
#
# Markdown never changes what compiles, and a docs-only card (SOL-83) would
# otherwise pay for a full build to prove it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# A newer commit supersedes an older one. Without this, pushing three commits
# in a session ran three builds to completion, two of them already answering a
# question nobody was still asking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read the repo and nothing else. Artifact upload and the SPM cache use the
# runner's own token, not this one. On a public repo a fork's pull request
# already runs with a read-only token; saying it here keeps a future
# `pull_request_target` or repository secret from widening it by accident.
permissions:
  contents: read

jobs:
  test:
    # Hosted, not self-hosted: the repo is public, so GitHub's macOS minutes
    # are free here regardless of the 10x private-repo rate that motivated
    # briefly routing this job through a self-hosted runner on the Mac. That
    # runner was never actually registered, so every push since was queuing a
    # job nobody would pick up — this restores the runner that just works.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Package.resolved pins the exact versions SPM will fetch, so it is the
      # right cache key input — unlike project.pbxproj, it only changes when a
      # dependency actually changes.
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Candid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Hardcoding a device name risks it not existing on the runner's
      # simulator image; the runner's own available-devices list already
      # knows what does, so ask it instead of guessing.
      - name: Pick a simulator
        id: simulator
        run: |
          name=$(xcrun simctl list devices available | grep -E '^\s+iPhone [0-9]' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*$//')
          if [ -z "$name" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing against: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: >
          xcodebuild -project Candid.xcodeproj -scheme Candid
          -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"
          -resultBundlePath TestResults
          test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  # The schema is where the product's guarantees actually live — RLS,
  # column grants, the can_view_post() rule — and until now nothing checked
  # it on a push. The two most serious findings of the 2026-09-04 review
  # were both SQL (client-writable columns, an anon-executable definer
  # function); nothing automated would have caught either (SOL-81).
  schema:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # This job never calls an HTTP API — the matrix talks straight to
      # Postgres — so every service the CLI can exclude is skipped. Only
      # the database container carries the schema (storage.objects and its
      # triggers included; those come from the Postgres image's own init,
      # not from the storage-api container), so excluding the rest is safe
      # and keeps startup to one container instead of a dozen.
      - name: Start the local database
        run: >
          supabase start -x
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Applies every migration in order, then supabase/seed.sql
      # ([db.seed] is enabled in config.toml) — the same two things
      # `supabase db push` and a manual seed run do against the hosted
      # project, replayed here on a throwaway database instead.
      - name: Apply migrations and seed
        run: supabase db reset

      # ON_ERROR_STOP makes any failing ASSERT or RAISE EXCEPTION fail this
      # step immediately; the grep guards against a script that exited
      # early without reaching its own final SELECT.
      - name: Run the visibility matrix
        run: |
          db_url=$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/visibility_matrix.sql | tee matrix.log
          grep -q 'all checks passed' matrix.log

      - name: Upload matrix output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-log
          path: matrix.log
